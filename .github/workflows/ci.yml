# Runs on every push and pull request. Nothing here needs a NodeMCU, a
# microphone, LM Studio or a Gemini key - every hardware and model
# boundary is faked in tests/conftest.py, so a red build is a real bug.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # --disable-pip --no-deps audits the pins exactly as written,
      # without installing anything - so the Windows-only packages are
      # checked here on Linux too. The lockfile carries the transitive
      # set for the Windows job.
      - name: Audit runtime pins
        run: pip-audit --disable-pip --no-deps --strict -r requirements.txt

      - name: Audit dev pins
        run: pip-audit --disable-pip --no-deps --strict -r requirements-dev.txt

      - name: Audit the full lockfile
        run: pip-audit --disable-pip --no-deps --strict -r requirements.lock.txt

  windows-install:
    # The real runtime is Windows-only (pycaw, pywin32, comtypes). This
    # job proves a fresh clone can install requirements.txt as written
    # and still pass the suite with the full dependency set present.
    name: full install + test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q
