[project]
name = "citra"
version = "0.1.0"
description = "A voice assistant that runs your flat and your PC. Local speech, real relays, no subscription."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# Every test in this suite must run with no hardware, no LM Studio, no
# Gemini key and no microphone. Anything that needs a real board or a
# real model belongs behind citra_doctor.py, not in here.
markers = [
    "hardware: needs a real NodeMCU on the LAN (never run in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["model_backups", "citra_ui", "citra_control_ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",   # tool descriptions the LLM reads are long single strings on purpose
    "UP031",  # "%d of %d" is fine; not worth churning every log line to f-strings
]

[tool.ruff.lint.per-file-ignores]
# HF_HUB_OFFLINE has to be decided BEFORE the heavy imports below it.
"jarvis_voice_assistant.py" = ["E402"]
